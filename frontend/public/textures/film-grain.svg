<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240">
<!-- Neutral photographic grain, tiled at low opacity over the whole scene. -->
<filter id="film" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="4"/>
<feColorMatrix type="saturate" values="0"/>
<feComponentTransfer><feFuncA type="table" tableValues="1 1"/></feComponentTransfer>
</filter>
<rect width="240" height="240" filter="url(#film)" opacity="0.5"/>
</svg>
